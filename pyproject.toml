[project]
name = "poison"
version = "0.1.0"
description = "output manipulation attack on language models by modifying gguf quantized weights."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gguf>=0.9.0",
  "numpy>=1.26",
]

[project.scripts]
poison = "poison.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poison"]
